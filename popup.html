<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Ad Blocker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand"><img src="icons/icon-48.png" width="40" height="40" alt=""><div><h1>Блокировка рекламы</h1><p class="subtitle">Для страниц YouTube</p></div></div>
      <label class="toggle-row" for="enabled">
        <span>Включено везде</span>
        <input id="enabled" type="checkbox" disabled>
      </label>
      <section id="page-controls" hidden>
        <label class="toggle-row" for="paused">
          <span>Пауза на этой вкладке</span>
          <input id="paused" type="checkbox" disabled>
        </label>
        <div class="buttons">
          <button id="video-exception" type="button" disabled>Исключить видео</button>
          <button id="channel-exception" type="button" disabled>Исключить канал</button>
        </div>
      </section>
      <section class="stats" aria-label="Статистика">
        <div><strong id="hidden-count">0</strong><span>скрыто рекламных блоков</span></div>
        <div><strong id="skipped-count">0</strong><span>обработано рекламных роликов</span></div>
      </section>
      <details>
        <summary>Диагностика</summary>
        <p id="diagnostics">Загрузка…</p>
      </details>
      <p id="status" role="status" aria-live="polite">Загрузка…</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
